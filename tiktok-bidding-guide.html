// ─── Budget calculator helper ─────────────────────────────────────────
function calcBudget(strategy, cpa, roas) {
  if (strategy === 'maximum-delivery') return {
    daily: cpa * 10,
    note: '10× ה-CPA היומי הממוצע מ-7 ימים אחרונים'
  };
  if (strategy === 'cost-cap') return {
    daily: cpa * 10,
    note: '10× ה-CPA bid המוגדר'
  };
  if (strategy === 'target-roas') return {
    daily: cpa * 30,
    note: '30× ה-CPA ההיסטורי (דרישת TikTok ל-ROAS)'
  };
  if (strategy === 'highest-value') return {
    daily: cpa * 10,
    note: '10× CPA (כמו Maximum Delivery — אין מינימום קשיח)'
  };
  if (strategy === 'bid-cap') return {
    daily: cpa * 5,
    note: 'לפחות 5× הביד — ודא שהביד תחרותי ביחס לשוק'
  };
  return null;
}
