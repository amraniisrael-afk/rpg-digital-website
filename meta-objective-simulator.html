<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>סימולטור אובייקטים — Meta Ads Manager</title>
<style>
  :root{
    --blue:#1877f2;
    --blue-light:#e7f0ff;
    --border:#dadde1;
    --gray-bg:#f0f2f5;
    --text-dim:#65676b;
    --green:#42b72a;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--gray-bg);
    margin:0;
    padding:18px;
    color:#050505;
    font-size:13px;
  }
  h1{font-size:17px;margin:0 0 3px;}
  .subtitle{color:var(--text-dim);font-size:11.5px;margin-bottom:14px;}
  .wrap{max-width:1300px;margin:0 auto;}

  /* top selectors bar */
  .top-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    margin-bottom:14px;
    align-items:flex-end;
  }
  .field{
    flex:1;
    min-width:170px;
  }
  label.field-label{
    font-size:11px;
    font-weight:700;
    margin-bottom:4px;
    display:block;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.2px;
  }
  select{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:12.5px;
    background:#fff;
  }
  select:disabled{background:#f5f6f7;color:var(--text-dim);}
  .locked-hint{font-size:10.5px;color:#9a7b00;margin-top:3px;}

  .panel{
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
  }

  .rec-badge{
    background:#e7f7e3;color:var(--green);
    font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:9px;
  }

  /* explanation boxes */
  .explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:800px){.explain-grid{grid-template-columns:1fr;}}
  .explain-box{
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    background:#fafbfc;
  }
  .explain-box.active{
    border-color:var(--blue);
    background:var(--blue-light);
  }
  .explain-title{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .explain-row{margin-bottom:6px;font-size:12px;line-height:1.55;}
  .explain-row b{color:#1c1e21;}
  .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
  .tag{
    background:#eef0f3;
    font-size:10px;
    padding:2px 8px;
    border-radius:11px;
    color:var(--text-dim);
  }
  .empty-state{
    color:var(--text-dim);
    font-size:12.5px;
    text-align:center;
    padding:30px 16px;
  }
  .breadcrumb{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:12px;
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .breadcrumb span.crumb{
    background:#f0f2f5;
    padding:2px 9px;
    border-radius:11px;
  }
  .scenario-box{
    grid-column:1 / -1;
    border:1px solid #b9d4ff;
    background:#eef5ff;
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:2px;
  }
  .scenario-box .explain-title{color:#0b5fc7;}
  .alt-row{font-size:11.5px;color:var(--text-dim);margin-top:6px;border-top:1px dashed #cdd8e8;padding-top:6px;}
</style>
</head>

<div class="wrap">

  </div>
</div>

  </div>
  <div class="field">

  </div>

  </div>
  <div class="field">
    <label class="field-label">4. Performance goal</label>
    <select id="goalSelect"></select>
    <div class="locked-hint" id="lockedHint" style="display:none;"></div>
  </div>
</div>

<div class="panel">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="explain-grid" id="explainWrap">
    <div class="empty-state">בחר אובייקט כדי להתחיל</div>
  </div>
</div>

</div>

let state = { objective:null, location:null, engagementType:null, goalSelected:null, bidSelected:null, scenarioInfo:null };

const ALL_OBJECTIVES = [
  {key:"Sales", available:true},
  {key:"Leads", available:true},
  {key:"Engagement", available:true},
  {key:"Traffic", available:true},
  {key:"Awareness", available:true},
  {key:"App Promotion", available:false}
];

function initObjectiveSelect(){
  const sel = document.getElementById('objSelect');
  sel.innerHTML = '<option value="" selected>בחר אובייקט...</option>';
  ALL_OBJECTIVES.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.key;
    opt.textContent = (DATA[o.key]?DATA[o.key].icon+' ':'') + o.key + (!o.available?' (בקרוב)':'');
    if(!o.available) opt.disabled = true;
    sel.appendChild(opt);
  });
  sel.onchange = ()=>{ if(sel.value) selectObjective(sel.value); };
}

function selectObjective(key, keepScenario){
  state.objective = key;
  state.location = null;
  state.engagementType = null;
  state.goalSelected = null;
  state.bidSelected = null;
  if(!keepScenario){
    state.scenarioInfo = null;
    document.getElementById('scenarioSelect').value = '';
  }
  renderBidSelect();
  renderLocationSelect();
  renderExplain();
}

function buildScenarioSelect(){
  const sel = document.getElementById('scenarioSelect');
  sel.innerHTML = '<option value="">בחר תרחיש עסקי מהרשימה...</option>';
  const categories = [...new Set(SCENARIOS.map(s=>s.cat))];
  categories.forEach(cat=>{
    const group = document.createElement('optgroup');
    group.label = cat;
    SCENARIOS.forEach((s,idx)=>{
      if(s.cat!==cat) return;
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = s.text;
      group.appendChild(opt);
    });
    sel.appendChild(group);
  });
  sel.onchange = ()=>{
    if(sel.value==='') return;
    applyScenario(SCENARIOS[parseInt(sel.value,10)]);
  };
  document.getElementById('resetScenarioBtn').onclick = ()=>{
    sel.value = '';
    state.scenarioInfo = null;
    document.getElementById('objSelect').value = '';
    state.objective = null;
    document.getElementById('bidSelect').innerHTML = '';
    document.getElementById('locationField').style.display='block';
    document.getElementById('locationSelect').innerHTML = '';
    document.getElementById('engagementTypeWrap').style.display='none';
    document.getElementById('goalSelect').innerHTML = '';
    document.getElementById('lockedHint').style.display='none';
    renderExplain();
  };
}

function applyScenario(s){
  document.getElementById('objSelect').value = s.objective;
  selectObjective(s.objective, true);

  document.getElementById('bidSelect').value = s.bid;
  state.bidSelected = s.bid;

  if(s.location){
    document.getElementById('locationSelect').value = s.location;
    state.location = s.location;
    state.engagementType = null;
    handleEngagementTypeVisibility();
    if(s.engagementType){
      document.getElementById('engagementTypeSelect').value = s.engagementType;
      state.engagementType = s.engagementType;
    }
    renderGoalSelect();
  }

  document.getElementById('goalSelect').value = s.goal;
  state.goalSelected = s.goal;

  state.scenarioInfo = s;
  renderExplain();
}

function renderBidSelect(){
  const sel = document.getElementById('bidSelect');
  sel.innerHTML = '';
  const strategies = DATA[state.objective].bidStrategies;
  strategies.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s.title; opt.textContent = s.title;
    sel.appendChild(opt);
  });
  sel.value = strategies[0].title;
  state.bidSelected = strategies[0].title;
  sel.onchange = ()=>{
    state.bidSelected = sel.value;
    if(state.location) renderGoalSelect();
    renderExplain();
  };
}

function visibleForBid(g){
  if(g.onlyWithBid && !g.onlyWithBid.includes(state.bidSelected)) return false;
  if(g.hideWithBid && g.hideWithBid.includes(state.bidSelected)) return false;
  return true;
}

function renderLocationSelect(){
  const field = document.getElementById('locationField');
  const sel = document.getElementById('locationSelect');
  sel.innerHTML = '';
  const locs = Object.keys(DATA[state.objective].locations);
  const single = locs.length===1 ? DATA[state.objective].locations[locs[0]] : null;

  if(single && single.hideLocationField){
    field.style.display='none';
    state.location = locs[0];
    handleEngagementTypeVisibility();
    renderGoalSelect();
    return;
  }
  field.style.display='block';

  locs.forEach(l=>{
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    sel.appendChild(opt);
  });
  sel.value = locs[0];
  state.location = locs[0];
  sel.onchange = ()=>{
    state.location = sel.value;
    state.engagementType = null;
    state.goalSelected = null;
    handleEngagementTypeVisibility();
    renderGoalSelect();
    renderExplain();
  };
  handleEngagementTypeVisibility();
  renderGoalSelect();
}

function handleEngagementTypeVisibility(){
  const locData = DATA[state.objective].locations[state.location];
  const wrap = document.getElementById('engagementTypeWrap');
  if(locData.needsEngagementType){
    wrap.style.display='block';
    const sel = document.getElementById('engagementTypeSelect');
    sel.innerHTML='';
    const types = Object.keys(locData.engagementTypes);
    types.forEach(t=>{
      const opt = document.createElement('option');
      opt.value=t; opt.textContent=t;
      sel.appendChild(opt);
    });
    sel.value = types[0];
    state.engagementType = types[0];
    sel.onchange = ()=>{
      state.engagementType = sel.value;
      state.goalSelected = null;
      renderGoalSelect();
      renderExplain();
    };
  } else {
    wrap.style.display='none';
    state.engagementType = null;
  }
}

function getCurrentLocationData(){
  const locData = DATA[state.objective].locations[state.location];
  if(locData.needsEngagementType){
    return locData.engagementTypes[state.engagementType];
  }
  return locData;
}

function renderGoalSelect(){
  const sel = document.getElementById('goalSelect');
  const hint = document.getElementById('lockedHint');
  sel.innerHTML = '';
  const data = getCurrentLocationData();
  const groupTitle = DATA[state.objective].locations[state.location].groupTitle;

  const visibleGoals = data.goals.filter(visibleForBid);
  const visibleOther = (data.other||[]).filter(visibleForBid);

  const mainGroup = document.createElement('optgroup');
  mainGroup.label = groupTitle || 'Goals';
  visibleGoals.forEach(g=>{
    const opt = document.createElement('option');
    opt.value = g.title;
    opt.textContent = g.title + (g.recommended ? ' ⭐ Recommended' : '');
    mainGroup.appendChild(opt);
  });
  sel.appendChild(mainGroup);

  if(visibleOther.length){
    const otherGroup = document.createElement('optgroup');
    otherGroup.label = data.otherTitle || 'Other goals';
    visibleOther.forEach(g=>{
      const opt = document.createElement('option');
      opt.value = g.title; opt.textContent = g.title;
      otherGroup.appendChild(opt);
    });
    sel.appendChild(otherGroup);
  }

  const rec = visibleGoals.find(g=>g.recommended) || visibleGoals[0] || visibleOther[0];
  sel.value = rec.title;
  state.goalSelected = rec.title;

  if(data.locked){
    sel.disabled = true;
    hint.style.display='block';
    hint.textContent = '🔒 ' + rec.title + ' is the only performance goal available for this conversion location.';
  } else {
    sel.disabled = false;
    hint.style.display='none';
  }

  sel.onchange = ()=>{
    state.goalSelected = sel.value;
    renderExplain();
  };
}

function renderExplain(){
  const wrap = document.getElementById('explainWrap');
  const crumb = document.getElementById('breadcrumb');
  if(!state.objective){
    wrap.innerHTML = '<div class="empty-state">בחר אובייקט כדי להתחיל</div>';
    crumb.innerHTML='';
    return;
  }
  let crumbHtml = `<span class="crumb">${state.objective}</span>`;
  if(state.location && state.location !== 'default') crumbHtml += `<span class="crumb">${state.location}</span>`;
  if(state.engagementType) crumbHtml += `<span class="crumb">${state.engagementType}</span>`;
  if(state.goalSelected) crumbHtml += `<span class="crumb">${state.goalSelected}</span>`;
  if(state.bidSelected) crumbHtml += `<span class="crumb">${state.bidSelected}</span>`;
  crumb.innerHTML = crumbHtml;

  let html = '';

  if(state.scenarioInfo){
    const s = state.scenarioInfo;
    html += `
      <div class="scenario-box">
        <div class="explain-title">💡 תרחיש: ${s.text}</div>
        <div class="explain-row"><b>למה המסלול הזה:</b> ${s.why}</div>
        <div class="alt-row"><b>חלופות אפשריות:</b> ${s.alt}</div>
      </div>
    `;
  }

  const locData = getCurrentLocationData();
  const allGoals = [...locData.goals, ...(locData.other||[])];
  const g = allGoals.find(x=>x.title===state.goalSelected);
  if(g){
    html += `
      <div class="explain-box active">
        <div class="explain-title">🎯 ${g.title} ${g.recommended?'<span class="rec-badge">Recommended</span>':''}</div>
        <div class="explain-row"><b>תיאור רשמי:</b> ${g.desc}</div>
        <div class="explain-row"><b>מתי להשתמש:</b> ${g.explain}</div>
        ${g.useWhen?`<div class="tag-row">${g.useWhen.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      </div>
    `;
  }

  const bs = DATA[state.objective].bidStrategies.find(s=>s.title===state.bidSelected);
  if(bs){
    html += `
      <div class="explain-box">
        <div class="explain-title">⚖️ Bid Strategy: ${bs.title}</div>
        <div class="explain-row"><b>תיאור רשמי:</b> ${bs.desc}</div>
        <div class="explain-row"><b>מתי להשתמש:</b> ${bs.explain}</div>
      </div>
    `;
  }

  wrap.innerHTML = html;
}

initObjectiveSelect();
buildScenarioSelect();
</script>

</body>
</html>
