<title>ארכיון הוקים · TikTok Creative</title>
<style>
  :root {
    --ground: #F1F2F5;
    --surface: #FFFFFF;
    --surface-2: #E7E9ED;
    --ink: #1B1D22;
    --ink-muted: #666B74;
    --hairline: rgba(27,29,34,0.14);
    --accent: #C9821F;
    --accent-ink: #1B1D22;
    --accent-strong: #8A5417;
    --accent-2: #1E7A72;
    --accent-2-bg: rgba(30,122,114,0.12);
    --danger: #B23A26;
    --danger-bg: rgba(178,58,38,0.10);
    --shadow: 0 1px 2px rgba(20,20,25,0.06), 0 8px 24px rgba(20,20,25,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #15171C;
      --surface: #1D2026;
      --surface-2: #262A31;
      --ink: #ECEDEF;
      --ink-muted: #9CA1AA;
      --hairline: rgba(236,237,239,0.13);
      --accent: #E3A23C;
      --accent-ink: #15171C;
      --accent-strong: #F0B563;
      --accent-2: #4FC2B8;
      --accent-2-bg: rgba(79,194,184,0.16);
      --danger: #E8594A;
      --danger-bg: rgba(232,89,74,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15171C; --surface: #1D2026; --surface-2: #262A31; --ink: #ECEDEF;
    --ink-muted: #9CA1AA; --hairline: rgba(236,237,239,0.13); --accent: #E3A23C;
    --accent-ink: #15171C; --accent-strong: #F0B563; --accent-2: #4FC2B8;
    --accent-2-bg: rgba(79,194,184,0.16); --danger: #E8594A; --danger-bg: rgba(232,89,74,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35); color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ground: #F1F2F5; --surface: #FFFFFF; --surface-2: #E7E9ED; --ink: #1B1D22;
    --ink-muted: #666B74; --hairline: rgba(27,29,34,0.14); --accent: #C9821F;
    --accent-ink: #1B1D22; --accent-strong: #8A5417; --accent-2: #1E7A72;
    --accent-2-bg: rgba(30,122,114,0.12); --danger: #B23A26; --danger-bg: rgba(178,58,38,0.10);
    --shadow: 0 1px 2px rgba(20,20,25,0.06), 0 8px 24px rgba(20,20,25,0.06); color-scheme: light;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body {
    direction: rtl;
    background: var(--ground);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .app { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  .masthead {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface-2);
    border-bottom: 1px solid var(--hairline);
    margin: -1.5rem -1.25rem 1.5rem;
    padding: 1.1rem 1.25rem;
    backdrop-filter: saturate(180%) blur(6px);
  }
  .masthead-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; max-width: 1180px; margin: 0 auto;
  }
  .title-block h1 {
    font-family: "Segoe UI Semibold", "Segoe UI", Arial, sans-serif;
    font-weight: 700; font-size: 1.6rem; margin: 0 0 0.15rem; text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .title-block p { margin: 0; color: var(--ink-muted); font-size: 0.88rem; max-width: 46ch; }

  .stat-strip { display: flex; gap: 1.4rem; }
  .stat-strip .stat { text-align: center; }
  .stat-strip .stat b {
    display: block; font-family: "Cascadia Code","Consolas",ui-monospace,monospace;
    font-variant-numeric: tabular-nums; font-size: 1.15rem; color: var(--ink);
  }
  .stat-strip .stat span { font-size: 0.68rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .toolbar {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--hairline);
    max-width: 1180px; margin-left: auto; margin-right: auto;
  }
  .toolbar label.f-label {
    display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.68rem;
    color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  select, input[type="text"], input[type="number"], input[type="url"], textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 5px; padding: 0.45rem 0.6rem;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .search-box { min-width: 190px; flex: 1 1 190px; }
  .toolbar .spacer { flex: 1 1 auto; }

  button { font: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
    border-radius: 5px; padding: 0.5rem 0.85rem; font-size: 0.85rem; font-weight: 600;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 0.32rem 0.55rem; font-size: 0.78rem; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.icon-only { padding: 0.4rem; }

  .clear-link {
    background: none; border: none; color: var(--accent-strong); font-size: 0.82rem;
    text-decoration: underline; text-underline-offset: 2px; padding: 0.3rem;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem; margin-top: 1.4rem;
  }

  .card {
    background: var(--surface); border: 1px solid var(--hairline); border-top: 3px solid var(--hairline);
    border-radius: 6px; padding: 0.95rem 1rem 0.85rem; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 0.55rem;
  }
  .card.featured { border-top-color: var(--accent); }
  .card.seed { outline: 1px dashed var(--hairline); outline-offset: -5px; }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
  .card-head h3 { margin: 0; font-size: 1.02rem; font-weight: 700; text-wrap: balance; }
  .card-date {
    font-family: "Cascadia Code","Consolas",ui-monospace,monospace; font-size: 0.68rem;
    color: var(--ink-muted); white-space: nowrap; padding-top: 0.15rem;
  }

  .card-meta { font-size: 0.8rem; color: var(--ink-muted); }
  .card-meta b { color: var(--ink); font-weight: 600; }

  .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .badge {
    font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-muted); white-space: nowrap;
  }
  .badge.strong { background: var(--accent); color: var(--accent-ink); }
  .badge.tag { background: var(--accent-2-bg); color: var(--accent-2); font-weight: 700; }

  .hook-block {
    border-inline-start: 3px solid var(--accent-2); padding-inline-start: 0.6rem;
    font-size: 0.87rem; color: var(--ink);
  }
  .hook-block .label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 0.15rem; }
  .hook-block q { font-style: italic; }

  .cta-line { font-size: 0.82rem; color: var(--ink-muted); }
  .cta-line b { color: var(--ink); font-weight: 600; }

  .stat-tiles { display: flex; gap: 0.6rem; }
  .tile { background: var(--surface-2); border-radius: 5px; padding: 0.4rem 0.6rem; flex: 1; text-align: center; }
  .tile b {
    display: block; font-family: "Cascadia Code","Consolas",ui-monospace,monospace;
    font-variant-numeric: tabular-nums; font-size: 0.95rem;
  }
  .tile span { font-size: 0.65rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .notes { font-size: 0.82rem; color: var(--ink-muted); white-space: pre-wrap; }

  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; border-top: 1px solid var(--hairline); padding-top: 0.6rem; margin-top: 0.1rem; }
  .links { display: flex; gap: 0.7rem; flex-wrap: wrap; }
  .links a { font-size: 0.8rem; color: var(--accent-strong); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem; }
  .links a:hover { text-decoration: underline; }
  .card-actions { display: flex; gap: 0.35rem; }
  .card-actions button { border: 1px solid var(--hairline); background: transparent; border-radius: 5px; padding: 0.3rem; color: var(--ink-muted); }
  .card-actions button:hover { color: var(--ink); border-color: var(--ink-muted); }
  .card-actions button.del:hover { color: var(--danger); border-color: var(--danger); }

  .backup-banner {
    display: none; align-items: center; gap: 0.8rem; flex-wrap: wrap;
    background: var(--accent-2-bg); border: 1px solid var(--accent-2);
    border-radius: 6px; padding: 0.6rem 0.9rem; margin-top: 1rem;
    font-size: 0.85rem; color: var(--ink);
  }
  .backup-banner.show { display: flex; }
  .backup-banner .msg { flex: 1 1 260px; }
  .backup-banner .msg b { color: var(--accent-2); }
  .backup-banner .actions { display: flex; gap: 0.5rem; }

  .empty {
    text-align: center; padding: 3.5rem 1rem; color: var(--ink-muted);
    border: 1px dashed var(--hairline); border-radius: 8px; margin-top: 1.4rem;
  }
  .empty p { margin: 0 0 0.8rem; }

  dialog {
    border: none; border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow); width: min(640px, 92vw); max-height: 88vh;
  }
  dialog::backdrop { background: rgba(10,10,12,0.5); backdrop-filter: blur(2px); }
  .dlg-inner { padding: 1.25rem 1.4rem 1.4rem; overflow-y: auto; max-height: 88vh; }
  .dlg-inner h2 { margin: 0 0 1rem; font-size: 1.2rem; font-family: "Segoe UI Semibold","Segoe UI",Arial,sans-serif; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 0.9rem; }
  .field-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.75rem; color: var(--ink-muted); font-weight: 600; }
  .field label .req { color: var(--danger); }
  textarea { resize: vertical; min-height: 3.4em; font-family: inherit; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.2rem; }

  .import-input { display: none; }

  @media (max-width: 640px) {
    .field-grid { grid-template-columns: 1fr; }
    .stat-strip { gap: 0.9rem; }
  }
</style>

<div class="app" dir="rtl" lang="he">

  <header class="masthead">
    <div class="masthead-row">
      <div class="title-block">
        <h1>ארכיון הוקים</h1>
        <p>מאגר סרטונים מובילים לפי ביצועים — לזיהוי דפוסים חוזרים והשראה לבריף הקריאייטיב הבא.</p>
      </div>
      <div class="stat-strip">
        <div class="stat"><b id="statTotal">0</b><span>סה"כ</span></div>
        <div class="stat"><b id="statShown">0</b><span>מוצג</span></div>
        <div class="stat"><b id="statTop">0</b><span>Top 1%</span></div>
      </div>
    </div>

    <div class="toolbar">
      <label class="f-label">תעשייה
        <select id="fIndustry"></select>
      </label>
      <label class="f-label">סוג הוק
        <select id="fHook"></select>
      </label>
      <label class="f-label">CTR
        <select id="fCtr"></select>
      </label>
      <label class="f-label">6s view rate
        <select id="fViewRate"></select>
      </label>
      <label class="f-label search-box">חיפוש חופשי
        <input type="text" id="fSearch" placeholder="חיפוש בטקסט, יוצר, מותג..." />
      </label>
      <label class="f-label">מיון
        <select id="fSort">
          <option value="date-desc">תאריך הוספה (חדש קודם)</option>
          <option value="views-desc">צפיות (גבוה לנמוך)</option>
          <option value="eng-desc">מעורבות (גבוה לנמוך)</option>
        </select>
      </label>
      <button class="clear-link" id="btnClear" type="button">נקה סינון</button>
      <div class="spacer"></div>
      <button class="btn ghost small" id="btnExportJson" type="button">ייצוא JSON</button>
      <button class="btn ghost small" id="btnExportCsv" type="button">ייצוא CSV</button>
      <label class="btn ghost small" for="fileImport" style="margin:0;">ייבוא JSON</label>
      <input class="import-input" type="file" id="fileImport" accept="application/json" />
      <button class="btn primary" id="btnAdd" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        הוספת וידאו
      </button>
    </div>
  </header>

  <div id="backupBanner" class="backup-banner">
    <div class="msg"><b>לא גיבית לאחרונה.</b> כדאי לייצא קובץ JSON כדי לא לאבד את המאגר אם הדפדפן מתנקה.</div>
    <div class="actions">
      <button class="btn small primary" id="btnBannerExport" type="button">ייצוא עכשיו</button>
      <button class="btn small ghost" id="btnBannerDismiss" type="button">תזכיר לי בעוד כמה ימים</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty" style="display:none;">
    <p>אין וידאו שתואם לסינון הנוכחי.</p>
    <button class="clear-link" id="btnClear2" type="button">נקה סינון וחזור לכל המאגר</button>
  </div>
</div>

<dialog id="entryDialog">
  <div class="dlg-inner">
    <h2 id="dlgTitle">הוספת וידאו</h2>
    <form id="entryForm" novalidate>
      <input type="hidden" id="fId" />
      <div class="field-grid">
        <div class="field full">
          <label for="fTitle">שם/תיאור קצר <span class="req">*</span></label>
          <input type="text" id="fTitle" required placeholder='למשל: "SIX MASKS – ספירה עולה בפתיחה"' />
        </div>

        <div class="field">
          <label for="fCreator">יוצר/handle</label>
          <input type="text" id="fCreator" placeholder="@username" />
        </div>
        <div class="field">
          <label for="fBrand">מותג</label>
          <input type="text" id="fBrand" placeholder="- אם תוכן אורגני" />
        </div>

        <div class="field">
          <label for="fIndustryIn">תעשייה <span class="req">*</span></label>
          <input type="text" id="fIndustryIn" list="industryList" required placeholder="Beauty & Personal Care" />
          <datalist id="industryList">
            <option value="Beauty & Personal Care"></option>
            <option value="Fashion & Accessories"></option>
            <option value="Food & Beverage"></option>
            <option value="Electronics"></option>
            <option value="Home & Garden"></option>
            <option value="Health & Wellness"></option>
            <option value="Baby & Maternity"></option>
            <option value="Pet Care"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="fRegion">אזור <span class="req">*</span></label>
          <input type="text" id="fRegion" list="regionList" required placeholder="United States" />
          <datalist id="regionList">
            <option value="United States"></option>
            <option value="Israel"></option>
            <option value="United Kingdom"></option>
            <option value="Canada"></option>
            <option value="Australia"></option>
            <option value="Global"></option>
          </datalist>
        </div>

        <div class="field">
          <label for="fViews">צפיות</label>
          <input type="number" id="fViews" min="0" placeholder="10600" />
        </div>
        <div class="field">
          <label for="fEng">מעורבות %</label>
          <input type="number" id="fEng" min="0" step="0.01" placeholder="0.85" />
        </div>

        <div class="field">
          <label for="fCtrTier">CTR — אחוזון</label>
          <select id="fCtrTier"></select>
        </div>
        <div class="field">
          <label for="fViewRateTier">6s view rate — אחוזון</label>
          <select id="fViewRateTier"></select>
        </div>

        <div class="field full">
          <label for="fHookType">סוג ההוק <span class="req">*</span></label>
          <select id="fHookType"></select>
        </div>
        <div class="field full">
          <label for="fHookText">מה קורה ב-3 השניות הראשונות <span class="req">*</span></label>
          <textarea id="fHookText" required placeholder='ציטוט או תיאור, למשל: "not one... not two... not three... SIX MASKS?!"'></textarea>
        </div>

        <div class="field full">
          <label for="fCta">תזמון ה-CTA / רגע ההמרה בגרף</label>
          <input type="text" id="fCta" placeholder='למשל: "שנייה 8 — חשיפת המוצר"' />
        </div>

        <div class="field">
          <label for="fLanding">קישור לדף נחיתה</label>
          <input type="url" id="fLanding" placeholder="https://" />
        </div>
        <div class="field">
          <label for="fVideoLink">קישור לסרטון</label>
          <input type="url" id="fVideoLink" placeholder="https://" />
        </div>

        <div class="field full">
          <label for="fNotes">הערות / תובנות</label>
          <textarea id="fNotes" placeholder="למה זה עבד, מה אפשר להעתיק ללקוח..."></textarea>
        </div>
      </div>

      <div class="dlg-actions">
        <button type="button" class="btn ghost" id="btnCancel">ביטול</button>
        <button type="submit" class="btn primary">שמירה</button>
      </div>
    </form>
  </div>
</dialog>

<script>
(function(){
  const KEY = 'rpg-tiktok-swipefile-v1';
  const BACKUP_KEY = KEY + '-backup-meta';
  const REMIND_AFTER_DAYS = 3;
  const TIER_OPTIONS = ['Top 1%','Top 5%','Top 10%','Top 25%','Top 50%','מתחת ל-50%','לא ידוע'];
  const HOOK_TYPES = ['שאלה מסקרנת','ספירה/רשימה','הפתעה/שוק','לפני-אחרי','בעיה-פתרון','הוכחה חברתית','POV/סיפור אישי','אחר'];
  const THRESHOLDS = [
    {v:'all', label:'הכל'},
    {v:'0', label:'Top 1% בלבד'},
    {v:'1', label:'Top 5% ומעלה'},
    {v:'2', label:'Top 10% ומעלה'},
    {v:'3', label:'Top 25% ומעלה'},
  ];

  function tierRank(t){ const i = TIER_OPTIONS.indexOf(t); return i === -1 ? TIER_OPTIONS.length : i; }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'2-digit'}); }

  function seed(){
    return [{
      id: uid(),
      dateAdded: new Date().toISOString(),
      title: 'SIX MASKS – ספירה עולה בפתיחה',
      creator: '@taesi_k_official',
      brand: '-',
      industry: 'Beauty & Personal Care',
      region: 'United States',
      views: 10600,
      engagement: 0.85,
      ctrTier: 'Top 1%',
      viewRateTier: 'Top 10%',
      hookType: 'ספירה/רשימה',
      hookText: 'not one... not two... not three... SIX MASKS?!',
      ctaTiming: 'חשיפת המוצר (שש המסכות) כבר בשניות הראשונות',
      landingPage: '',
      videoLink: '',
      notes: 'דוגמה ראשונית שהוזנה מתוך ניתוח מסך TikTok One — אפשר לערוך או למחוק ולהתחיל להוסיף וידאו אמיתיים.',
      isSeed: true
    }];
  }

  let entries = [];
  try {
    const raw = localStorage.getItem(KEY);
    entries = raw ? JSON.parse(raw) : seed();
  } catch(e){ entries = seed(); }
  if (!entries.length) entries = seed();
  save();

  function save(){ localStorage.setItem(KEY, JSON.stringify(entries)); }

  function loadBackupMeta(){
    try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; } catch(e){ return {}; }
  }
  function saveBackupMeta(meta){ localStorage.setItem(BACKUP_KEY, JSON.stringify(meta)); }

  function updateBackupBanner(){
    const banner = document.getElementById('backupBanner');
    const realEntries = entries.filter(e => !e.isSeed);
    if (!realEntries.length) { banner.classList.remove('show'); return; }
    const meta = loadBackupMeta();
    const earliest = Math.min(...realEntries.map(e => new Date(e.dateAdded).getTime()));
    const refTime = Math.max(
      meta.lastExport ? new Date(meta.lastExport).getTime() : 0,
      meta.lastDismissed ? new Date(meta.lastDismissed).getTime() : 0,
      earliest
    );
    const daysSince = (Date.now() - refTime) / 86400000;
    banner.classList.toggle('show', daysSince >= REMIND_AFTER_DAYS);
  }

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const fIndustry = document.getElementById('fIndustry');
  const fHook = document.getElementById('fHook');
  const fCtr = document.getElementById('fCtr');
  const fViewRate = document.getElementById('fViewRate');
  const fSearch = document.getElementById('fSearch');
  const fSort = document.getElementById('fSort');

  function fillSelect(sel, options, placeholder){
    sel.innerHTML = '';
    if (placeholder) { const o = document.createElement('option'); o.value=''; o.textContent = placeholder; sel.appendChild(o); }
    options.forEach(v => { const o = document.createElement('option'); o.value = v.v !== undefined ? v.v : v; o.textContent = v.label !== undefined ? v.label : v; sel.appendChild(o); });
  }

  function buildFacets(){
    const industries = Array.from(new Set(entries.map(e => e.industry).filter(Boolean))).sort();
    const prevIndustry = fIndustry.value;
    fillSelect(fIndustry, ['הכל', ...industries]);
    if (industries.includes(prevIndustry) || prevIndustry === 'הכל') fIndustry.value = prevIndustry || 'הכל';

    fillSelect(fHook, ['הכל', ...HOOK_TYPES]);
    fillSelect(fCtr, THRESHOLDS);
    fillSelect(fViewRate, THRESHOLDS);
  }

  function currentFilters(){
    return {
      industry: fIndustry.value,
      hook: fHook.value,
      ctr: fCtr.value,
      viewRate: fViewRate.value,
      search: fSearch.value.trim().toLowerCase(),
      sort: fSort.value,
    };
  }

  function applyFilters(){
    const f = currentFilters();
    let list = entries.filter(e => {
      if (f.industry && f.industry !== 'הכל' && e.industry !== f.industry) return false;
      if (f.hook && f.hook !== 'הכל' && e.hookType !== f.hook) return false;
      if (f.ctr && f.ctr !== 'all' && tierRank(e.ctrTier) > parseInt(f.ctr,10)) return false;
      if (f.viewRate && f.viewRate !== 'all' && tierRank(e.viewRateTier) > parseInt(f.viewRate,10)) return false;
      if (f.search) {
        const hay = [e.title, e.creator, e.brand, e.hookText, e.notes, e.industry, e.region].join(' ').toLowerCase();
        if (!hay.includes(f.search)) return false;
      }
      return true;
    });
    if (f.sort === 'views-desc') list.sort((a,b) => (b.views||0) - (a.views||0));
    else if (f.sort === 'eng-desc') list.sort((a,b) => (b.engagement||0) - (a.engagement||0));
    else list.sort((a,b) => new Date(b.dateAdded) - new Date(a.dateAdded));
    return list;
  }

  function render(){
    buildFacets();
    updateBackupBanner();
    const list = applyFilters();
    document.getElementById('statTotal').textContent = entries.length;
    document.getElementById('statShown').textContent = list.length;
    document.getElementById('statTop').textContent = entries.filter(e => e.ctrTier === 'Top 1%' || e.viewRateTier === 'Top 1%').length;

    grid.innerHTML = '';
    emptyState.style.display = list.length ? 'none' : 'block';

    list.forEach(e => {
      const featured = e.ctrTier === 'Top 1%' || e.ctrTier === 'Top 5%' || e.viewRateTier === 'Top 1%' || e.viewRateTier === 'Top 5%';
      const card = document.createElement('article');
      card.className = 'card' + (featured ? ' featured' : '') + (e.isSeed ? ' seed' : '');
      card.innerHTML = `
        <div class="card-head">
          <h3>${esc(e.title)}</h3>
          <span class="card-date">${fmtDate(e.dateAdded)}</span>
        </div>
        <div class="card-meta"><b>${esc(e.industry)}</b> · ${esc(e.region)}${e.creator ? ' · ' + esc(e.creator) : ''}${e.brand && e.brand !== '-' ? ' · ' + esc(e.brand) : ''}</div>
        <div class="badges">
          <span class="badge ${tierRank(e.ctrTier) <= 2 ? 'strong' : ''}">CTR: ${esc(e.ctrTier || 'לא ידוע')}</span>
          <span class="badge ${tierRank(e.viewRateTier) <= 2 ? 'strong' : ''}">6s: ${esc(e.viewRateTier || 'לא ידוע')}</span>
          <span class="badge tag">${esc(e.hookType)}</span>
        </div>
        <div class="hook-block">
          <span class="label">הוק (0–3 שניות)</span>
          <q>${esc(e.hookText)}</q>
        </div>
        ${e.ctaTiming ? `<div class="cta-line"><b>תזמון CTA:</b> ${esc(e.ctaTiming)}</div>` : ''}
        <div class="stat-tiles">
          <div class="tile"><b>${e.views ? Number(e.views).toLocaleString('he-IL') : '—'}</b><span>צפיות</span></div>
          <div class="tile"><b>${e.engagement !== '' && e.engagement != null ? e.engagement + '%' : '—'}</b><span>מעורבות</span></div>
        </div>
        ${e.notes ? `<div class="notes">${esc(e.notes)}</div>` : ''}
        <div class="card-foot">
          <div class="links">
            ${e.landingPage ? `<a href="${esc(e.landingPage)}" target="_blank" rel="noopener">דף נחיתה ↗</a>` : ''}
            ${e.videoLink ? `<a href="${esc(e.videoLink)}" target="_blank" rel="noopener">הסרטון ↗</a>` : ''}
          </div>
          <div class="card-actions">
            <button type="button" class="edit" data-id="${e.id}" title="עריכה" aria-label="עריכה">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" class="del" data-id="${e.id}" title="מחיקה" aria-label="מחיקה">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 6h18"/><path d="M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // ---- dialog / form ----
  const dlg = document.getElementById('entryDialog');
  const form = document.getElementById('entryForm');
  const dlgTitle = document.getElementById('dlgTitle');

  function fillTierSelects(){
    fillSelect(document.getElementById('fCtrTier'), TIER_OPTIONS);
    fillSelect(document.getElementById('fViewRateTier'), TIER_OPTIONS);
    fillSelect(document.getElementById('fHookType'), HOOK_TYPES);
  }
  fillTierSelects();

  function openDialog(entry){
    fillTierSelects();
    dlgTitle.textContent = entry ? 'עריכת וידאו' : 'הוספת וידאו';
    document.getElementById('fId').value = entry ? entry.id : '';
    document.getElementById('fTitle').value = entry ? entry.title : '';
    document.getElementById('fCreator').value = entry ? entry.creator : '';
    document.getElementById('fBrand').value = entry ? entry.brand : '';
    document.getElementById('fIndustryIn').value = entry ? entry.industry : '';
    document.getElementById('fRegion').value = entry ? entry.region : '';
    document.getElementById('fViews').value = entry ? entry.views : '';
    document.getElementById('fEng').value = entry ? entry.engagement : '';
    document.getElementById('fCtrTier').value = entry ? entry.ctrTier : 'לא ידוע';
    document.getElementById('fViewRateTier').value = entry ? entry.viewRateTier : 'לא ידוע';
    document.getElementById('fHookType').value = entry ? entry.hookType : HOOK_TYPES[0];
    document.getElementById('fHookText').value = entry ? entry.hookText : '';
    document.getElementById('fCta').value = entry ? entry.ctaTiming : '';
    document.getElementById('fLanding').value = entry ? entry.landingPage : '';
    document.getElementById('fVideoLink').value = entry ? entry.videoLink : '';
    document.getElementById('fNotes').value = entry ? entry.notes : '';
    dlg.showModal();
  }

  document.getElementById('btnAdd').addEventListener('click', () => openDialog(null));
  document.getElementById('btnCancel').addEventListener('click', () => dlg.close());

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const id = document.getElementById('fId').value;
    const data = {
      id: id || uid(),
      dateAdded: id ? (entries.find(e => e.id === id) || {}).dateAdded || new Date().toISOString() : new Date().toISOString(),
      title: document.getElementById('fTitle').value.trim(),
      creator: document.getElementById('fCreator').value.trim(),
      brand: document.getElementById('fBrand').value.trim(),
      industry: document.getElementById('fIndustryIn').value.trim(),
      region: document.getElementById('fRegion').value.trim(),
      views: document.getElementById('fViews').value ? Number(document.getElementById('fViews').value) : '',
      engagement: document.getElementById('fEng').value ? Number(document.getElementById('fEng').value) : '',
      ctrTier: document.getElementById('fCtrTier').value,
      viewRateTier: document.getElementById('fViewRateTier').value,
      hookType: document.getElementById('fHookType').value,
      hookText: document.getElementById('fHookText').value.trim(),
      ctaTiming: document.getElementById('fCta').value.trim(),
      landingPage: document.getElementById('fLanding').value.trim(),
      videoLink: document.getElementById('fVideoLink').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
    };
    if (!data.title || !data.industry || !data.region || !data.hookText) return;
    if (id) {
      const idx = entries.findIndex(e => e.id === id);
      if (idx > -1) entries[idx] = data;
    } else {
      entries.push(data);
    }
    save();
    dlg.close();
    render();
  });

  grid.addEventListener('click', (ev) => {
    const editBtn = ev.target.closest('.edit');
    const delBtn = ev.target.closest('.del');
    if (editBtn) {
      const entry = entries.find(e => e.id === editBtn.dataset.id);
      if (entry) openDialog(entry);
    } else if (delBtn) {
      if (confirm('למחוק את הוידאו הזה מהמאגר?')) {
        entries = entries.filter(e => e.id !== delBtn.dataset.id);
        save();
        render();
      }
    }
  });

  // ---- filters ----
  [fIndustry, fHook, fCtr, fViewRate, fSort].forEach(el => el.addEventListener('change', render));
  fSearch.addEventListener('input', render);
  document.getElementById('btnClear').addEventListener('click', clearFilters);
  document.getElementById('btnClear2').addEventListener('click', clearFilters);
  function clearFilters(){
    fIndustry.value = 'הכל'; fHook.value = 'הכל'; fCtr.value = 'all'; fViewRate.value = 'all'; fSearch.value = '';
    render();
  }

  // ---- export / import ----
  function exportJson(){
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tiktok-hook-archive.json';
    a.click();
    const meta = loadBackupMeta();
    meta.lastExport = new Date().toISOString();
    saveBackupMeta(meta);
    updateBackupBanner();
  }
  document.getElementById('btnExportJson').addEventListener('click', exportJson);
  document.getElementById('btnBannerExport').addEventListener('click', exportJson);
  document.getElementById('btnBannerDismiss').addEventListener('click', () => {
    const meta = loadBackupMeta();
    meta.lastDismissed = new Date().toISOString();
    saveBackupMeta(meta);
    updateBackupBanner();
  });

  document.getElementById('btnExportCsv').addEventListener('click', () => {
    const cols = ['title','creator','brand','industry','region','views','engagement','ctrTier','viewRateTier','hookType','hookText','ctaTiming','landingPage','videoLink','notes','dateAdded'];
    const csvEsc = (v) => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
    const rows = [cols.join(',')].concat(entries.map(e => cols.map(c => csvEsc(e[c])).join(',')));
    const blob = new Blob(['﻿' + rows.join('\n')], {type: 'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tiktok-hook-archive.csv';
    a.click();
  });

  document.getElementById('fileImport').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (Array.isArray(imported)) {
          imported.forEach(item => { item.id = uid(); entries.push(item); });
          save();
          render();
          alert('יובאו ' + imported.length + ' רשומות.');
        }
      } catch(e) { alert('קובץ לא תקין.'); }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  render();
})();
</script>
