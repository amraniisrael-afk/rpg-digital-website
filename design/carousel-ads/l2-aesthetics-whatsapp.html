<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.ad { background: linear-gradient(165deg, #FBEDE8 0%, #F6DCD3 60%, #EFCABF 100%); color: #3B2A2A; }
.glow { position: absolute; width: 760px; height: 760px; border-radius: 50%; left: -240px; top: -200px; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 65%); }
.content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
.brand { color: #B0716A; }
h1 { font-size: 104px; font-weight: 900; line-height: 1.02; margin-top: 30px; color: #3B2A2A; }
h1 span { color: #C2574A; }
.sub { font-size: 38px; margin-top: 18px; color: #7A5A55; font-weight: 500; }
.phone { margin-top: 40px; margin-bottom: 40px; background: #ECE5DD; border-radius: 36px; padding: 30px 30px 34px; box-shadow: 0 30px 70px rgba(120,60,50,.22); border: 10px solid #fff; }
.bar { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.av { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(135deg, #E8A598, #C2574A); }
.who { font-size: 30px; font-weight: 800; color: #1F2C2A; }
.who small { display: block; font-size: 22px; font-weight: 500; color: #25A35A; }
.msg { max-width: 82%; font-size: 30px; line-height: 1.38; padding: 18px 24px; border-radius: 22px; margin-bottom: 16px; color: #1F2C2A; font-weight: 500; }
.in { background: #fff; border-top-right-radius: 6px; }
.out { background: #D9FDD3; margin-right: auto; border-top-left-radius: 6px; }
.t { display: block; font-size: 20px; color: #8C9A97; text-align: left; margin-top: 6px; }
.quick { display: flex; gap: 14px; margin-top: 6px; }
.q { flex: 1; background: #fff; border-radius: 16px; text-align: center; font-size: 28px; font-weight: 800; color: #1B8D4A; padding: 16px 0; }
.cta { margin-top: auto; width: 100%; background: #3B2A2A; color: #fff; }
</style></head><body>
<div class="ad"><div class="glow"></div>
<div class="content">
  <div class="brand">קליניקה לאסתטיקה</div>
  <h1>עור זוהר<br><span>לפני האירוע.</span></h1>
  <div class="sub">ייעוץ אישי ללא עלות. עונות לך תוך דקות.</div>
  <div class="phone">
    <div class="bar"><div class="av"></div><div class="who">הקליניקה<small>מקלידה…</small></div></div>
    <div class="msg in">היי, ראיתי את המודעה על הטיפול 🙂<span class="t">21:47</span></div>
    <div class="msg out">היי! שמחות שפנית 💛 מתי נוח לך להגיע לייעוץ?<span class="t">21:47</span></div>
    <div class="quick"><span class="q">מחר בבוקר</span><span class="q">יום חמישי</span><span class="q">בשבוע הבא</span></div>
  </div>
  <div class="cta">קבעי ייעוץ חינם ←</div>
</div></div>
</body></html>
